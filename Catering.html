<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catering Inquiry</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>

<!-- same header -->

<main class="container content">
  <h1>Catering Inquiry</h1>
  <form id="caterForm">
    <label>Name<input type="text" id="cName" required></label>
    <label>Phone<input type="tel" id="cPhone" required></label>
    <label>Email<input type="email" id="cEmail" required></label>
    <label>Date<input type="date" id="cDate"></label>
    <label>Guests<input type="number" id="cGuests"></label>
    <label>Details<textarea id="cDetails" rows="4" required></textarea></label>
    <button class="btn">Submit Inquiry</button>
  </form>
</main>

<footer class="site-footer">
  <div class="container">
    © <span id="year5"></span> Chop Nigerian Cuisine
  </div>
</footer>

<script src="Script.js"></script>
</body>
</html>
